version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigilant
      POSTGRES_PASSWORD: vigilant
      POSTGRES_DB: vigilanteye
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  backend:
    build: ./backend
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://vigilant:vigilant@db:5432/vigilanteye
    volumes:
      - ./evidence_store:/app/evidence_store
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
