databases:
  - name: vigilanteye-db
    plan: free

services:
  - type: web
    name: vigilanteye-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vigilanteye-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: EVIDENCE_DIR
        value: /tmp/evidence_store
